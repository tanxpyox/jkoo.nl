<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Health Tools</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .tabs {
  display: flex;
  justify-content: flex-start;
  margin-top: 2rem;
  margin-bottom: -1rem;
  background: transparent;
  max-width: 600px;
  width: 100%;
}

.tab {
  padding: 0.5rem 1rem;
  cursor: pointer;
  font-weight: bold;
  background: #f9f9f9;
  border: 1px solid #ddd;
  border-bottom: none;
  border-radius: 1rem 1rem 0 0;
  transition: background 0.3s;
  white-space: nowrap;
  margin-right: -1px; /* Remove visual gap caused by borders */
}

.tab:last-child {
  margin-right: 0;
}

.tab.active {
  background: white;
  border-bottom: 2px solid white;
  position: relative;
  z-index: 1;
}

    .container {
      background: white;
      padding: 2rem;
      border-radius: 1rem 1rem 1rem 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      margin-top: 1rem; /* ← Add this line to push it below the tabs */
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    body {
      font-family: sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }
    @media all and (min-width: 600px) {
      .container {
      margin-top: 30px;
      }
    }
    h1 {
      text-align: center;
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    input, select {
      width: 100%;
      padding: 0.5rem;
      border-radius: 0.5rem;
      border: 1px solid #ccc;
    }
    .output {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 1.25rem;
      font-weight: bold;
    }
      .switch {
      position: relative;
      display: inline-block;
      width: 80px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #007BFF;
      transition: 0.4s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: #fff;
      transition: 0.4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #28a745;
    }
    input:checked + .slider:before {
      transform: translateX(58px);
    }
      .slider.round::after {
      content: 'Metric';
      color: white;
      font-size: 0.7rem;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 20%;
      padding-left: 0;
      transition: 0.4s;
    }
    input:checked + .slider.round::after {
      content: 'Imperial';
      justify-content: flex-start;
      padding-left: 12%;
      padding-right: 0;
    }
    input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      outline: none;
      transition: background 0.2s;
    }
    input[type="range"]:hover {
      background: #ccc;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #111827;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.3);
      background: #374151;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #111827;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    input[type="range"]:active::-moz-range-thumb {
      transform: scale(1.3);
      background: #374151;
    }
  </style>
</head>

<body>
  <div class="tabs">
    <div class="tab active" data-tab="tab-1rm">1RM</div>
    <div class="tab" data-tab="tab-tdee">TDEE</div>
    <div class="tab" data-tab="tab-ffmi">FFMI</div>
  </div>
  <div class="container">
    <!-- 1RM Calculator -->
    <div id="tab-1rm" class="tab-content active">
      <div class="slider-group">
        <label for="weight1rm">Weight Lifted: <span id="weightVal">100</span></label>
        <input type="range" id="weight1rm" min="20" max="300" value="100">
      </div>
      <div class="slider-group">
        <label for="reps">Reps: <span id="repsVal">5</span></label>
        <input type="range" id="reps" min="1" max="15" value="5">
      </div>
      <div class="output">
        Estimated 1RM: <span id="output">117</span>
      </div>
      <footer>1RM = weight × (1 + reps / 30)</footer>
    </div>

    <!-- TDEE Calculator -->
    <div id="tab-tdee" class="tab-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h1 style="margin: 0;">TDEE Calculator</h1>
      <label class="switch">
        <input type="checkbox" id="unitToggleTDEE">
        <span class="slider round"></span>
      </label>
    </div>
      <div class="form-group">
        <label for="weightTDEE">Weight</label>
        <input type="number" id="weightTDEE" value="70">
      </div>
      <div class="form-group">
        <label for="heightTDEE">Height</label>
        <input type="number" id="heightTDEE" value="175">
      </div>
      <div class="form-group">
        <label for="ageTDEE">Age</label>
        <input type="number" id="ageTDEE" value="30">
      </div>
      <div class="form-group">
        <label for="genderTDEE">Gender</label>
        <select id="genderTDEE">
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="form-group">
        <label for="activityTDEE">Activity Level</label>
        <select id="activityTDEE">
          <option value="1.2">Sedentary</option>
          <option value="1.375">Light</option>
          <option value="1.55" selected>Moderate</option>
          <option value="1.725">Active</option>
          <option value="1.9">Very Active</option>
        </select>
      </div>
      <div class="output">
        TDEE: <span id="tdeeOutput">—</span> kcal/day
      </div>
      <div class="output">
        BMI: <span id="bmiOutput">—</span>
      </div>
      <div class="progress-bar"><div id="bmiBar"></div></div>
      <div class="category-label" id="bmiCategory"></div>
    </div>

    <!-- FFMI Calculator -->
    <div id="tab-ffmi" class="tab-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h1 style="margin: 0;">FFMI Calculator</h1>
      <label class="switch">
        <input type="checkbox" id="unitToggleFFMI">
        <span class="slider round"></span>
      </label>
    </div>
      <div style="display: flex; gap: 1rem;">
  <div class="form-group" style="flex: 1;">
    <label for="weightFFMI">Weight (kg)</label>
    <input type="number" min="0" id="weight" placeholder="e.g. 70" value="70">
  </div>
  <div class="form-group" style="flex: 1;">
    <label for="heightFFMI">Height (cm)</label>
    <input type="number" min="0" id="height" placeholder="e.g. 175" value="175">
  </div>
  </div>
      <div class="form-group">
        <label for="bodyfatFFMI">Body Fat %</label>
        <input type="number" id="bodyfatFFMI" value="15">
      </div>
      <div class="output">
        FFMI: <span id="ffmiOutput">—</span>
      </div>
      <div class="output">
        Normalized FFMI: <span id="normFFMIOutput">—</span>
      </div>
      <div class="category-label" id="ffmiCategory"></div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    // 1RM Calculator
    const weightSlider = document.getElementById('weight1rm');
    const repsSlider = document.getElementById('reps');
    const weightVal = document.getElementById('weightVal');
    const repsVal = document.getElementById('repsVal');
    const output = document.getElementById('output');
    function updateEstimate() {
      const w = parseInt(weightSlider.value);
      const r = parseInt(repsSlider.value);
      const estimated1RM = Math.round(w * (1 + r / 30));
      weightVal.textContent = w;
      repsVal.textContent = r;
      output.textContent = estimated1RM;
    }

    function convertTDEEUnits() {
      const toggle = document.getElementById('unitToggleTDEE');
      const weight = document.getElementById('weightTDEE');
      const height = document.getElementById('heightTDEE');
      if (toggle.checked) {
        weight.value = (parseFloat(weight.value) * 2.20462).toFixed(1);
        height.value = (parseFloat(height.value) / 2.54).toFixed(1);
      } else {
        weight.value = (parseFloat(weight.value) / 2.20462).toFixed(1);
        height.value = (parseFloat(height.value) * 2.54).toFixed(1);
      }
      calculateTDEE();
    }

    function calculateTDEE() {
      let weight = parseFloat(document.getElementById('weightTDEE').value);
      let height = parseFloat(document.getElementById('heightTDEE').value);
      const age = parseInt(document.getElementById('ageTDEE').value);
      const gender = document.getElementById('genderTDEE').value;
      const activity = parseFloat(document.getElementById('activityTDEE').value);
      const isImperial = document.getElementById('unitToggleTDEE').checked;
      if (isImperial) {
        weight = weight / 2.20462;
        height = height * 2.54;
      }
      if (isNaN(weight) || isNaN(height) || isNaN(age)) return;
      let bmr = gender === 'male'
        ? 10 * weight + 6.25 * height - 5 * age + 5
        : 10 * weight + 6.25 * height - 5 * age - 161;
      const tdee = Math.round(bmr * activity);
      document.getElementById('tdeeOutput').textContent = tdee;
      const bmi = weight / ((height / 100) ** 2);
      document.getElementById('bmiOutput').textContent = bmi.toFixed(1);
      const bar = document.getElementById('bmiBar');
      const label = document.getElementById('bmiCategory');
      const percent = Math.min(100, bmi / 40 * 100);
      bar.style.width = percent + '%';
      if (bmi < 18.5) {
        bar.style.background = '#00bcd4'; label.textContent = 'Underweight';
      } else if (bmi < 25) {
        bar.style.background = '#4caf50'; label.textContent = 'Normal';
      } else if (bmi < 30) {
        bar.style.background = '#ff9800'; label.textContent = 'Overweight';
      } else {
        bar.style.background = '#f44336'; label.textContent = 'Obese';
      }
    }

    function convertFFMIUnits() {
      const toggle = document.getElementById('unitToggleFFMI');
      const weight = document.getElementById('weightFFMI');
      const height = document.getElementById('heightFFMI');
      if (toggle.checked) {
        weight.value = (parseFloat(weight.value) * 2.20462).toFixed(1);
        height.value = (parseFloat(height.value) / 2.54).toFixed(1);
      } else {
        weight.value = (parseFloat(weight.value) / 2.20462).toFixed(1);
        height.value = (parseFloat(height.value) * 2.54).toFixed(1);
      }
      calculateFFMI();
    }

    function calculateFFMI() {
      let weight = parseFloat(document.getElementById('weightFFMI').value);
      let height = parseFloat(document.getElementById('heightFFMI').value);
      const bodyfat = parseFloat(document.getElementById('bodyfatFFMI').value);
      const isImperial = document.getElementById('unitToggleFFMI').checked;
      if (isImperial) {
        weight = weight / 2.20462;
        height = height * 2.54;
      }
      if (isNaN(weight) || isNaN(height) || isNaN(bodyfat)) return;
      const heightM = height / 100;
      const leanMass = weight * (1 - bodyfat / 100);
      const ffmi = leanMass / (heightM * heightM);
      const normFFMI = ffmi + 6.1 * (1.8 - heightM);
      document.getElementById('ffmiOutput').textContent = ffmi.toFixed(1);
      document.getElementById('normFFMIOutput').textContent = normFFMI.toFixed(1);
      const label = document.getElementById('ffmiCategory');
      if (normFFMI < 18) {
        label.textContent = 'Below Average';
      } else if (normFFMI < 20) {
        label.textContent = 'Average';
      } else if (normFFMI < 22) {
        label.textContent = 'Above Average';
      } else if (normFFMI < 23) {
        label.textContent = 'Excellent';
      } else if (normFFMI < 26) {
        label.textContent = 'Superior';
      } else if (normFFMI < 28) {
        label.textContent = 'Suspicion of Steroid Use';
      } else {
        label.textContent = 'Steroid Usage Likely';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateEstimate();
      calculateTDEE();
      calculateFFMI();
    });

    document.querySelectorAll('#tab-tdee input, #tab-tdee select').forEach(el => {
      el.addEventListener('input', calculateTDEE);
    });
    document.getElementById('unitToggleTDEE').addEventListener('change', convertTDEEUnits);

    document.querySelectorAll('#tab-ffmi input').forEach(el => {
      el.addEventListener('input', calculateFFMI);
    });
    document.getElementById('unitToggleFFMI').addEventListener('change', convertFFMIUnits);
  </script>
</body>
